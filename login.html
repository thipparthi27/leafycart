<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafyCart - Login</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('https://static.vecteezy.com/system/resources/previews/016/807/599/non_2x/beautiful-green-leaf-background-watercolor-vector.jpg') no-repeat center/contain;
            overflow: hidden;
            background-size: cover;
            animation: float 6s infinite ease-in-out;
            font-family: Arial, sans-serif;
        }
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        .welcome-text {
            position: absolute;
            top: 10%;
            font-size: 2rem;
            color: rgb(1, 18, 10);
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }
        .login-container {
            background: rgb(199, 237, 199);
            padding: 60px;
            border-radius: 100px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            width: 100px;
            height:100px;
            margin-bottom:-10px;
            border-radius:50%;
        }
        .login-box h2 {
            margin-bottom: 15px;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5%;
        }
        .login-box button {
            
            width: 100%;
            padding: 10px;
            background: #4ca2cd;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5%;
            cursor: pointer;
        }
        .signup-box button:hover {
            background: #3b92b0;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="leaf floating-leaf"></div>
        <div class="leaf floating-leaf"></div>
        <div class="leaf floating-leaf"></div>
    </div>
    
    <div class="welcome-text">Welcome Back</div>
    
    <div class="login-container">
        <img src="img/core-img/logo.png" alt="LeafyCart Logo" class="logo">
        <div class="login-box">
            <h2>Login</h2>
            <form action="login.php" method="POST">
                <input type="email" name="email" placeholder="Enter Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button><br><br>
            </form>
            <style>
                .links-container {
                  display: flex;
                  justify-content: space-between; /* or justify-content: space-around */
                }
              </style>
              
             <div class="links-container">
            <a href="index.html">Home<br>
                <a href="/forgot-password">Forgot Password?</a></div>
            <p>Don't have an account? <a href="signup.html">signup here</a></p>
    </div><script src="script.js"></script>
        </div>
        </div>
    </div>
    
    <script>
        gsap.from(".welcome-text", { opacity: 0, y: -50, duration: 1.5, ease: "power2.out" });
        gsap.from(".login-container", { opacity: 0, scale: 0.8, duration: 1, delay: 1 });
    </script>
</body>
</html>
