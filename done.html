<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful 🎉</title>
    <style>
        body {
            text-align: center;
            background-color: #f4fff8;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow: hidden;
        }
        .success-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 128, 0, 0.3);
            text-align: center;
            animation: fadeIn 1.5s ease-in-out, glow 2s infinite alternate;
            position: relative;
            z-index: 2;
        }
        .logo {
            width: 150px;
            margin-bottom: 15px;
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            color: #2ecc71;
            font-size: 36px;
            margin-bottom: 10px;
            animation: popIn 1.2s ease-out;
        }
        p {
            color: #444;
            font-size: 18px;
            animation: fadeIn 2s ease-in-out;
        }
        .btn {
            background: #2ecc71;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            transition: 0.3s ease-in-out;
            font-size: 18px;
            box-shadow: 0px 5px 10px rgba(0, 128, 0, 0.3);
        }
        .btn:hover {
            background: #27ae60;
            transform: scale(1.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes glow {
            from { box-shadow: 0px 0px 10px rgba(46, 204, 113, 0.5); }
            to { box-shadow: 0px 0px 20px rgba(46, 204, 113, 0.8); }
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Floating Leaves Animation */
        .leaf {
            position: absolute;
            width: 50px;
            height: 50px;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- LeafyCart Logo -->
    <img src="img/core-img/logo.png" alt="LeafyCart Logo" class="logo">

    <div class="success-container">
        <h1>🎉 Order Placed Successfully! 🎉</h1>
        <p>Thank you for shopping with us. Your order is on its way! 🚚</p>
        <a href="shop.html" class="btn">🛍️ Continue Shopping</a>
        <a href="index.html" class="btn">🏠 Go to Home</a>
    </div>

    <!-- Confetti Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.3.1"></script>
    <script>
        function launchConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        launchConfetti();
    </script>

    <!-- Floating Leaves Effect -->
    <script>
        function createLeaf() {
            const leaf = document.createElement("div");
            leaf.classList.add("leaf");
            leaf.innerHTML = "🍃";
            leaf.style.left = Math.random() * window.innerWidth + "px";
            leaf.style.animationDuration = Math.random() * 5 + 5 + "s";
            document.body.appendChild(leaf);
            setTimeout(() => leaf.remove(), 6000);
        }
        setInterval(createLeaf, 500);
    </script>

</body>
</html>
