<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafyCart - Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url("https://img.freepik.com/free-vector/watercolor-nature-background-with-leaves_52683-59449.jpg?semt=ais_hybrid") no-repeat center/contain;
            overflow: hidden;
            background-size: cover;
            animation: float 6s infinite ease-in-out;
            font-family: Arial, sans-serif;
        }
        .background {
            position: absolute;
            width:100%;
            height: 100%;
            overflow: hidden;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        .welcome-text {
            position: absolute;
            top: 10%;
            font-size: 2rem;
            color: rgb(1, 18, 10);
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
        }
        .signup-container {
            background: rgb(199, 237, 199);
            padding: 1px;
            border-radius: 100px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            width: 100px;
            height:100px;
            margin-bottom:-10px;
            border-radius:50%;
        }
        .signup-box h2 {
            margin-bottom: 15px;
        }
        .signup-box input {
            width: 50%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5%;
        }
        .signup-box button {
            width: 50%;
            padding: 10px;
            background: #4ca2cd;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5%;
            cursor: pointer;
        }
        .signup-box button:hover {
            background: #3b92b0;
        }
    </style>
</head>
<body>
    <div class="background">
        <div class="leaf floating-leaf"></div>
        <div class="leaf floating-leaf"></div>
        <div class="leaf floating-leaf"></div>
    </div>
    
    <div class="welcome-text">Join LeafyCart Today</div>
    
    <div class="signup-container">
        <img src="img/core-img/logo.png" alt="LeafyCart Logo" class="logo">
        <div class="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="text" id="name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form><br>
            <div class="links-container">
                <a href="index.html">Home<br></a>
            </div>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    
    <script>
        gsap.from(".welcome-text", { opacity: 0, y: -50, duration: 1.5, ease: "power2.out" });
        gsap.from(".signup-container", { opacity: 0, scale: 0.8, duration: 1, delay: 1 });

        document.getElementById("signup-form").addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let password = document.getElementById("password").value.trim();

            if (name === "" || email === "" || password === "") {
                alert("All fields are required!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("users")) || [];

            // Check if the email is already registered
            let existingUser = users.find(user => user.email === email);

            if (existingUser) {
                alert("User already exists! Redirecting to login page.");
                window.location.href = "login.html";
            } else {
                users.push({ name: name, email: email, password: password });
                localStorage.setItem("users", JSON.stringify(users));
                alert("Signup successful! Redirecting to login page.");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
